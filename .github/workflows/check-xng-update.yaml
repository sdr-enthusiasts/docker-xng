---
name: Check xng update

# Watches the upstream xng repository for new commits on the ref this image
# actually builds and, when the published image was built from an older
# commit, triggers the Deploy workflow to rebuild against the newest source.
#
# Source of truth for "what is deployed" is the published image's
# /CONTAINER_VERSION file (written by the Dockerfile from the built commit).
#
# Source of truth for "what ref do we build" is the XNG_REF ARG in the
# Dockerfile — NOT this file. Hardcoding a branch here silently breaks the
# comparison whenever the Dockerfile is pinned to a topic branch or tag,
# producing an unconditional daily rebuild that can never converge.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  check:
    name: Compare upstream HEAD to deployed version
    runs-on: ubuntu-latest

    steps:
      # Required: `gh workflow run` resolves the target repo from the git
      # remote, and the Dockerfile is parsed below for the pinned ref.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read build ref from Dockerfile
        id: ref
        run: |
          set -euo pipefail
          arg_value() {
            sed -n "s/^ARG $1=\"\\(.*\\)\"\$/\\1/p" Dockerfile | tail -n1
          }
          repo_url="$(arg_value XNG_REPO)"
          upstream_ref="$(arg_value XNG_REF)"
          if [[ -z "${repo_url}" || -z "${upstream_ref}" ]]; then
            echo "::error::Could not parse XNG_REPO/XNG_REF from Dockerfile" >&2
            exit 1
          fi
          # https://github.com/owner/name.git -> owner/name
          repo="${repo_url#https://github.com/}"
          repo="${repo%.git}"
          echo "Dockerfile builds ${repo}@${upstream_ref}"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "ref=${upstream_ref}" >> "$GITHUB_OUTPUT"

      - name: Get upstream HEAD commit
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: ${{ steps.ref.outputs.repo }}
          UPSTREAM_REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          upstream_sha="$(gh api \
            "repos/${UPSTREAM_REPO}/commits/${UPSTREAM_REF}" \
            --jq '.sha')"
          echo "Upstream ${UPSTREAM_REPO}@${UPSTREAM_REF} HEAD: ${upstream_sha}"
          echo "sha=${upstream_sha}" >> "$GITHUB_OUTPUT"

      - name: Read deployed image CONTAINER_VERSION
        id: deployed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}:latest
        run: |
          set -euo pipefail
          # Log in so we can pull the (possibly private) published image.
          echo "${GH_TOKEN}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

          deployed_sha=""
          if docker pull "${IMAGE}" >/dev/null 2>&1; then
            deployed_sha="$(docker run --rm --entrypoint cat "${IMAGE}" \
              /CONTAINER_VERSION 2>/dev/null | tr -d '[:space:]' || true)"
          else
            echo "No published image yet (${IMAGE}); will trigger a build."
          fi
          echo "Deployed CONTAINER_VERSION: ${deployed_sha:-<none>}"
          echo "sha=${deployed_sha}" >> "$GITHUB_OUTPUT"

      - name: Trigger Deploy when out of date
        if: steps.upstream.outputs.sha != steps.deployed.outputs.sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REF: ${{ steps.ref.outputs.ref }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          DEPLOYED_SHA: ${{ steps.deployed.outputs.sha }}
        run: |
          set -euo pipefail
          reason="xng upstream ${UPSTREAM_REF} advanced: deployed=${DEPLOYED_SHA:-none} -> upstream=${UPSTREAM_SHA}"
          echo "${reason}"
          gh workflow run "Deploy" \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f reason="${reason}"

      - name: Already up to date
        if: steps.upstream.outputs.sha == steps.deployed.outputs.sha
        run: echo "Deployed image is already built from the latest upstream commit."
